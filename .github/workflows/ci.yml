name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-disposable-better-auth-secret-32chars-min
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_disposable_key_that_cannot_send
      RESEND_BASE_URL: http://127.0.0.1:43132
      AUTH_EMAIL_FROM: accounts@auth.example.com
      AUTH_EMAIL_REPLY_TO: reply@example.com
      DATABASE_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_MIGRATION_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_TEST_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test

    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: zedarchive_test
          POSTGRES_PASSWORD: zedarchive_ci_password
          POSTGRES_USER: zedarchive_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Assert pinned Node.js and npm
        run: |
          node --input-type=module -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          corepack npm --version | grep -Fx '11.18.0'

      - name: Install dependencies
        run: corepack npm ci

      - name: Verify lifecycle-script policy
        run: corepack npm run verify:install-script-policy

      - name: Validate every materialized catalogue release
        run: corepack npm run catalogue:release:check

      - name: Check formatting
        run: corepack npm run format:check

      - name: Lint
        run: corepack npm run lint

      - name: Type check
        run: corepack npm run typecheck

      - name: Audit production dependencies
        run: corepack npm audit --omit=dev --audit-level=high

      - name: Validate development catalogue seed
        run: corepack npm run db:seed:check

      - name: Validate Wikidata import inputs
        run: corepack npm run catalogue:import:wikidata:check

      - name: Verify migration is current
        run: |
          corepack npm run db:generate
          git diff --exit-code -- drizzle

      - name: Unit test
        run: corepack npm test

      - name: Test release-critical browser helpers
        run: corepack npm run test:browser:critical:helpers

      - name: Database integration test
        run: corepack npm run test:integration

  browser-release-critical:
    name: Release-critical browser
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BETTER_AUTH_SECRET: ci-disposable-better-auth-secret-32chars-min
      BETTER_AUTH_URL: http://127.0.0.1:3103
      RESEND_API_KEY: re_ci_disposable_key_that_cannot_send
      RESEND_BASE_URL: http://127.0.0.1:43134
      AUTH_EMAIL_FROM: accounts@auth.example.com
      AUTH_EMAIL_REPLY_TO: reply@example.com
      DATABASE_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_MIGRATION_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_TEST_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      ACCOUNT_PURGE_ENABLED: 'false'

    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: zedarchive_test
          POSTGRES_PASSWORD: zedarchive_ci_password
          POSTGRES_USER: zedarchive_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Assert pinned Node.js and npm
        run: |
          node --input-type=module -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          corepack npm --version | grep -Fx '11.18.0'

      - name: Install dependencies
        run: corepack npm ci

      - name: Apply migrations for release-critical browser testing
        run: corepack npm run db:migrate

      - name: Install Playwright Chromium
        run: corepack npm exec -- playwright install --with-deps chromium

      - name: Run release-critical browser tests
        run: corepack npm run test:browser:critical

      - name: Audit release-critical diagnostics before upload
        id: audit-release-critical-diagnostics
        if: failure()
        run: node --import tsx tests/browser-release-critical/fixtures/artifact-audit.ts

      - name: Upload allowlisted release-critical diagnostics
        if: failure() && steps.audit-release-critical-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-critical-browser-diagnostics
          path: |
            test-results-release-critical/diagnostics/public-catalogue-core.json
            test-results-release-critical/diagnostics/account-and-add-core.json
            test-results-release-critical/diagnostics/archive-tracking-lifecycle.json
            test-results-release-critical/diagnostics/archive-backup-lifecycle.json
            test-results-release-critical/diagnostics/account-recovery-deletion-lifecycle.json
          if-no-files-found: ignore
          retention-days: 7

  browser-extended:
    name: Extended browser
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETTER_AUTH_SECRET: ci-disposable-better-auth-secret-32chars-min
      BETTER_AUTH_URL: http://127.0.0.1:3100
      RESEND_API_KEY: re_ci_disposable_key_that_cannot_send
      RESEND_BASE_URL: http://127.0.0.1:43132
      AUTH_EMAIL_FROM: accounts@auth.example.com
      AUTH_EMAIL_REPLY_TO: reply@example.com
      DATABASE_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_MIGRATION_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_TEST_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test

    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: zedarchive_test
          POSTGRES_PASSWORD: zedarchive_ci_password
          POSTGRES_USER: zedarchive_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Assert pinned Node.js and npm
        run: |
          node --input-type=module -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          corepack npm --version | grep -Fx '11.18.0'

      - name: Install dependencies
        run: corepack npm ci

      - name: Apply migrations for extended browser testing
        run: corepack npm run db:migrate

      - name: Install Playwright Chromium
        run: corepack npm exec -- playwright install --with-deps chromium

      - name: Run extended browser tests
        run: corepack npm run test:browser:extended

      - name: Upload allowlisted public failure screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-public-browser-screenshots
          path: |
            test-results/playwright/public-sign-in.smoke-*/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 7

  account-purge-operational:
    name: Account-purge operational
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNT_PURGE_ENABLED: 'true'
      BETTER_AUTH_SECRET: ci-disposable-better-auth-secret-32chars-min
      BETTER_AUTH_URL: http://127.0.0.1:3106
      DATABASE_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_MIGRATION_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      DATABASE_TEST_URL: postgresql://zedarchive_app:zedarchive_ci_password@localhost:5432/zedarchive_test
      RESEND_API_KEY: re_ci_disposable_key_that_cannot_send
      RESEND_BASE_URL: http://127.0.0.1:43132
      AUTH_EMAIL_FROM: accounts@auth.example.com
      AUTH_EMAIL_REPLY_TO: reply@example.com

    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: zedarchive_test
          POSTGRES_PASSWORD: zedarchive_ci_password
          POSTGRES_USER: zedarchive_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Assert pinned Node.js and npm
        run: |
          node --input-type=module -e "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
          corepack npm --version | grep -Fx '11.18.0'

      - name: Install dependencies
        run: corepack npm ci

      - name: Run account-purge operational evidence
        run: corepack npm run test:operational:account-purge
