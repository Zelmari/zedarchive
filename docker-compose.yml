services:
  postgres:
    image: postgres:16-alpine
    container_name: zedarchive-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: zedarchive
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d zedarchive']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
